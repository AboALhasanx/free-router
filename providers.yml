# Free Model API Gateway — provider + group definitions
# Only the assistant edits this file. Clients (OpenCode, omp) never see raw
# provider/model ids; they only see the group names under "groups".
#
# To add a new free provider from a tweet you paste:
#   1. add a `providers:` entry (baseUrl + apiKey)
#   2. add its model ids as routes under the right group(s)
#   3. run:  curl -X POST http://127.0.0.1:8765/v1/_test_all
#   4. check: curl http://127.0.0.1:8765/v1/_status

groups:
  free-fast:
    - vyceai/deepseek-v4-flash
    - vyceai/deepseek-v4-flash-lr
    - vyceai/gpt-5.6-luna
    - inferx/Qwen3.8-27B-FP8
    - inferx/Qwen3.6-35B-A3B-FP8
    - inferx/gemma-4-31B-it-fp8
  free-reasoning:
    - vyceai/claude-sonnet-4-6
    - vyceai/deepseek-v4-flash
    - inferx/glm-5.3-flash
    - inferx/Qwen3.6-35B-A3B-FP8
  free-coder:
    - inferx/Qwen3-Coder-Next-FP8
    - inferx/Devstral-2-123B-Instruct-2512-int4-AutoRound
    - vyceai/claude-sonnet-4-6
    - inferx/gpt-oss-20b
  free-vision:
    - inferx/deepseek-v4-flash-vision-exp
  free-default:
    - vyceai/gpt-5.6-luna
    - vyceai/claude-sonnet-4-6
    - vyceai/deepseek-v4-flash
    - inferx/glm-5.3-flash
    - inferx/Qwen3.8-27B-FP8

providers:
  vyceai:
    baseUrl: https://vyceai.com/v1
    apiKey: sk-cbc42b31d46e25d4fb8283243420a904818cbdc5a69d669b
    cooldown_minutes: 1
  inferx:
    baseUrl: https://model.inferx.net/endpoints/v1
    apiKey: ix_dcfba75ce34f426fefb7350bad7c432259c290720deb570a5dac21bee2a0f03a
    cooldown_minutes: 1
  bai:
    baseUrl: https://api.b.ai/v1
    apiKey: sk-2k2juiulmtadis221p6uxfgj3xpl3t85
    cooldown_minutes: 1
  opencode-zen:
    baseUrl: https://opencode.ai/zen/v1
    apiKey: sk-hfpLwcOcYA8W6KyGc8EjMRdwObQYhiFeTnIELhFYnUrdwkxxDqhkai8PTHx4cmUR
    cooldown_minutes: 10
  # gmicloud deferred — base URL not yet confirmed on this host.
  # Stays available directly via OpenCode's gmicloud provider and omp's gmi-cloud.
  # opencode-zen free tier (mimo-v2.5-free, ling-3.0-flash-fin-free, nemotron-*, big-pickle, muse-spark-1.3-contributor-free)
  # is OpenCode-only (MissingSessionID outside TUI) — use via native opencode provider, not via free-router proxy.
  # Paid zen models work via free-router if you add credits.

# Per-route input caps so "Input token exceed" never reaches upstream.
route_overrides:
  vyceai/deepseek-v4-flash:    { max_input_tokens: 120000 }
  vyceai/deepseek-v4-flash-lr: { max_input_tokens: 120000 }
  vyceai/claude-sonnet-4-6:    { max_input_tokens: 180000 }
  vyceai/gpt-5.6-luna:         { max_input_tokens: 250000 }
  inferx/glm-5.3-flash:        { max_input_tokens: 100000 }
  inferx/Qwen3.8-27B-FP8:      { max_input_tokens: 80000 }
  inferx/Qwen3.6-35B-A3B-FP8:  { max_input_tokens: 80000 }
  inferx/Qwen3-Coder-Next-FP8: { max_input_tokens: 100000 }
